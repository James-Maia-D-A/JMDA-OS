<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALC_NET // CYBERNETIC COMPUTATION SYSTEM</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: #0b0c16;
            --border-color: #1f223f;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #f4ee00;
            --neon-green: #00ff66;
            --text-main: #c0d2ff;
            --text-dim: #505c8a;
            --shadow-cyan: 0 0 10px rgba(0, 243, 255, 0.3);
            --shadow-pink: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
        }

        .cyber-frame {
            background: var(--bg-panel);
            border: 2px solid var(--neon-cyan);
            box-shadow: var(--shadow-cyan), inset 0 0 20px rgba(0, 243, 255, 0.05);
            width: 100%;
            max-width: 650px;
            position: relative;
            padding: 20px;
            clip-path: polygon(
                0 0, 
                calc(100% - 15px) 0, 
                100% 15px, 
                100% 100%, 
                15px 100%, 
                0 calc(100% - 15px)
            );
            transition: all 0.3s ease;
        }

        .cyber-frame::before {
            content: "SYS.VER // 4.08-X";
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-deep);
            padding: 0 10px;
            font-size: 10px;
            color: var(--neon-cyan);
            letter-spacing: 2px;
        }

        /* Mode Selector Header */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .mode-btn {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 8px 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            clip-path: polygon(0 0, 90% 0, 100% 30%, 100% 100%, 10% 100%, 0 70%);
        }

        .mode-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .mode-btn.active {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: var(--shadow-cyan);
        }

        /* Display Screen */
        .display-container {
            background: #020308;
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
            text-align: right;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .display-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0, 243, 255, 0.02) 50%);
            background-size: 100% 3px;
            pointer-events: none;
        }

        .history-screen {
            font-size: 12px;
            color: var(--text-dim);
            min-height: 18px;
            word-break: break-all;
        }

        .main-screen {
            font-size: 28px;
            color: var(--neon-cyan);
            font-weight: bold;
            word-break: break-all;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }

        /* Layout Panels */
        .calc-panel {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-panel.active {
            display: grid;
        }

        /* Special Layouts */
        .calc-panel.scientific {
            grid-template-columns: repeat(6, 1fr);
        }

        .calc-panel.dev {
            grid-template-columns: repeat(4, 1fr);
        }

        /* Cyber Buttons */
        .c-btn {
            background: #0d0f1f;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            font-weight: bold;
            user-select: none;
        }

        .c-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: var(--shadow-cyan);
        }

        .c-btn:active {
            transform: scale(0.96);
        }

        .c-btn.op {
            border-color: rgba(255, 0, 85, 0.4);
            color: var(--neon-pink);
        }
        .c-btn.op:hover {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 85, 0.1);
            box-shadow: var(--shadow-pink);
        }

        .c-btn.func {
            border-color: rgba(244, 238, 0, 0.4);
            color: var(--neon-yellow);
            font-size: 13px;
        }
        .c-btn.func:hover {
            border-color: var(--neon-yellow);
            background: rgba(244, 238, 0, 0.1);
            box-shadow: 0 0 10px rgba(244, 238, 0, 0.3);
        }

        .c-btn.equals {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            grid-column: span 2;
        }

        .c-btn.span-2 {
            grid-column: span 2;
        }

        /* Dev Mode Specific Styles */
        .dev-subdisplay {
            background: #020308;
            border: 1px solid var(--border-color);
            padding: 8px;
            margin-bottom: 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
        }

        .dev-subdisplay span {
            color: var(--neon-green);
        }

        .disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* Footer Decors */
        .cyber-footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--neon-green);
            box-shadow: 0 0 5px var(--neon-green);
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="cyber-frame">
        <!-- Selector de Módulos -->
        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('basic', this)">Básica</button>
            <button class="mode-btn" onclick="switchMode('scientific', this)">Científica</button>
            <button class="mode-btn" onclick="switchMode('dev', this)">Programador</button>
            <button class="mode-btn" onclick="switchMode('financial', this)">Financeira</button>
        </div>

        <!-- Tela de Exibição Compartilhada -->
        <div class="display-container">
            <div class="history-screen" id="history"></div>
            <div class="main-screen" id="display">0</div>
        </div>

        <!-- MODO: BÁSICO -->
        <div id="panel-basic" class="calc-panel active">
            <button class="c-btn func" onclick="clearAll()">AC</button>
            <button class="c-btn func" onclick="deleteChar()">DEL</button>
            <button class="c-btn op" onclick="appendValue('%')">%</button>
            <button class="c-btn op" onclick="appendValue('/')">÷</button>
            
            <button class="c-btn" onclick="appendValue('7')">7</button>
            <button class="c-btn" onclick="appendValue('8')">8</button>
            <button class="c-btn" onclick="appendValue('9')">9</button>
            <button class="c-btn op" onclick="appendValue('*')">×</button>
            
            <button class="c-btn" onclick="appendValue('4')">4</button>
            <button class="c-btn" onclick="appendValue('5')">5</button>
            <button class="c-btn" onclick="appendValue('6')">6</button>
            <button class="c-btn op" onclick="appendValue('-')">-</button>
            
            <button class="c-btn" onclick="appendValue('1')">1</button>
            <button class="c-btn" onclick="appendValue('2')">2</button>
            <button class="c-btn" onclick="appendValue('3')">3</button>
            <button class="c-btn op" onclick="appendValue('+')">+</button>
            
            <button class="c-btn span-2" onclick="appendValue('0')">0</button>
            <button class="c-btn" onclick="appendValue('.')">.</button>
            <button class="c-btn equals" onclick="calculate()">=</button>
        </div>

        <!-- MODO: CIENTÍFICO -->
        <div id="panel-scientific" class="calc-panel scientific">
            <button class="c-btn func" onclick="clearAll()">AC</button>
            <button class="c-btn func" onclick="deleteChar()">DEL</button>
            <button class="c-btn func" onclick="appendValue('(')">(</button>
            <button class="c-btn func" onclick="appendValue(')')">)</button>
            <button class="c-btn op" onclick="appendValue('**')">x^y</button>
            <button class="c-btn op" onclick="appendValue('/')">÷</button>

            <button class="c-btn func" onclick="applyFunc('sin')">sin</button>
            <button class="c-btn func" onclick="applyFunc('cos')">cos</button>
            <button class="c-btn func" onclick="applyFunc('tan')">tan</button>
            <button class="c-btn" onclick="appendValue('7')">7</button>
            <button class="c-btn" onclick="appendValue('8')">8</button>
            <button class="c-btn" onclick="appendValue('9')">9</button>
            <button class="c-btn op" onclick="appendValue('*')">×</button>

            <button class="c-btn func" onclick="applyFunc('log')">log</button>
            <button class="c-btn func" onclick="applyFunc('ln')">ln</button>
            <button class="c-btn func" onclick="applyFunc('sqrt')">√</button>
            <button class="c-btn" onclick="appendValue('4')">4</button>
            <button class="c-btn" onclick="appendValue('5')">5</button>
            <button class="c-btn" onclick="appendValue('6')">6</button>
            <button class="c-btn op" onclick="appendValue('-')">-</button>

            <button class="c-btn func" onclick="appendValue('Math.PI')">π</button>
            <button class="c-btn func" onclick="appendValue('Math.E')">e</button>
            <button class="c-btn func" onclick="applyFunc('fact')">n!</button>
            <button class="c-btn" onclick="appendValue('1')">1</button>
            <button class="c-btn" onclick="appendValue('2')">2</button>
            <button class="c-btn" onclick="appendValue('3')">3</button>
            <button class="c-btn op" onclick="appendValue('+')">+</button>

            <button class="c-btn span-2" onclick="appendValue('0')">0</button>
            <button class="c-btn" onclick="appendValue('.')">.</button>
            <button class="c-btn equals" style="grid-column: span 3;" onclick="calculate()">=</button>
        </div>

        <!-- MODO: PROGRAMADOR / DEV -->
        <div id="panel-dev" class="calc-panel dev">
            <div style="grid-column: span 4;">
                <div class="dev-subdisplay">
                    HEX: <span id="val-hex">0</span>
                    DEC: <span id="val-dec">0</span>
                    BIN: <span id="val-bin">0</span>
                </div>
            </div>
            <button class="c-btn func" onclick="setDevBase('HEX')">HEX</button>
            <button class="c-btn func" onclick="setDevBase('DEC')">DEC</button>
            <button class="c-btn func" onclick="setDevBase('OCT')">OCT</button>
            <button class="c-btn func" onclick="setDevBase('BIN')">BIN</button>

            <button class="c-btn dev-key" onclick="appendDev('A')">A</button>
            <button class="c-btn dev-key" onclick="appendDev('B')">B</button>
            <button class="c-btn func" onclick="clearAll()">AC</button>
            <button class="c-btn func" onclick="deleteChar()">DEL</button>

            <button class="c-btn dev-key" onclick="appendDev('C')">C</button>
            <button class="c-btn dev-key" onclick="appendDev('D')">D</button>
            <button class="c-btn" onclick="appendDev('7')">7</button>
            <button class="c-btn" onclick="appendDev('8')">8</button>

            <button class="c-btn dev-key" onclick="appendDev('E')">E</button>
            <button class="c-btn dev-key" onclick="appendDev('F')">F</button>
            <button class="c-btn" onclick="appendDev('4')">4</button>
            <button class="c-btn" onclick="appendDev('5')">5</button>

            <button class="c-btn op" onclick="bitwiseOp('&')">AND</button>
            <button class="c-btn op" onclick="bitwiseOp('|')">OR</button>
            <button class="c-btn" onclick="appendDev('1')">1</button>
            <button class="c-btn" onclick="appendDev('2')">2</button>

            <button class="c-btn op" onclick="bitwiseOp('^')">XOR</button>
            <button class="c-btn op" onclick="bitwiseOp('~')">NOT</button>
            <button class="c-btn" onclick="appendDev('0')">0</button>
            <button class="c-btn equals" onclick="calculateDev()">=</button>
        </div>

        <!-- MODO: FINANCEIRO -->
        <div id="panel-financial" class="calc-panel" style="grid-template-columns: repeat(2, 1fr);">
            <div style="grid-column: span 2; font-size: 12px; color: var(--neon-yellow); margin-bottom: 5px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">
                SIMULADOR DE JUROS COMPOSTOS (CYBER_FIN)
            </div>
            <div style="font-size: 12px; color: var(--text-dim); display:flex; flex-direction:column; gap:5px; grid-column: span 2;">
                <label>Capital Inicial (R$): <input type="number" id="fin-pv" value="1000" style="background:#020308; border:1px solid var(--border-color); color:var(--text-main); padding:5px;"></label>
                <label>Taxa de Juros Mensal (%): <input type="number" id="fin-i" value="1.5" style="background:#020308; border:1px solid var(--border-color); color:var(--text-main); padding:5px;"></label>
                <label>Período (Meses): <input type="number" id="fin-n" value="12" style="background:#020308; border:1px solid var(--border-color); color:var(--text-main); padding:5px;"></label>
            </div>
            <button class="c-btn equals" style="grid-column: span 2; margin-top: 10px;" onclick="calculateFinancial()">Calcular Rendimento</button>
        </div>

        <div class="cyber-footer">
            <div><span class="status-dot"></span>CORE STATUS: ONLINE</div>
            <div>SECURE_CALC_UNIT</div>
        </div>
    </div>

    <script>
        let currentMode = 'basic';
        let currentExpression = '';
        let historyExpression = '';
        
        // Configurações do modo Programador
        let devBase = 'DEC';
        let devValue = 0;

        function updateDisplay() {
            document.getElementById('display').innerText = currentExpression === '' ? '0' : currentExpression;
            document.getElementById('history').innerText = historyExpression;
        }

        function switchMode(mode, btnElement) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            document.querySelectorAll('.calc-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + mode).classList.add('active');

            clearAll();
        }

        function appendValue(val) {
            currentExpression += val;
            updateDisplay();
        }

        function clearAll() {
            currentExpression = '';
            historyExpression = '';
            updateDisplay();
            if(currentMode === 'dev') {
                devValue = 0;
                updateDevDisplays(0);
            }
        }

        function deleteChar() {
            currentExpression = currentExpression.toString().slice(0, -1);
            updateDisplay();
        }

        function applyFunc(func) {
            try {
                let val = eval(currentExpression);
                if (isNaN(val)) throw Error();
                let res = 0;
                switch(func) {
                    case 'sin': res = Math.sin(val); break;
                    case 'cos': res = Math.cos(val); break;
                    case 'tan': res = Math.tan(val); break;
                    case 'log': res = Math.log10(val); break;
                    case 'ln': res = Math.log(val); break;
                    case 'sqrt': res = Math.sqrt(val); break;
                    case 'fact': 
                        res = 1;
                        for (let i = 2; i <= val; i++) res *= i;
                        break;
                }
                historyExpression = `${func}(${val})`;
                currentExpression = res.toString();
                updateDisplay();
            } catch(e) {
                currentExpression = 'ERR_SYNTAX';
                updateDisplay();
                setTimeout(clearAll, 1200);
            }
        }

        function calculate() {
            try {
                let sanitized = currentExpression.replace(/×/g, '*').replace(/÷/g, '/');
                historyExpression = currentExpression;
                let result = eval(sanitized);
                if (!isFinite(result)) throw Error();
                currentExpression = Number(result.toFixed(8)).toString();
                updateDisplay();
            } catch (err) {
                currentExpression = 'ERR_CALC';
                updateDisplay();
                setTimeout(clearAll, 1200);
            }
        }

        // Lógica Avançada do Modo Programador
        function setDevBase(base) {
            devBase = base;
            // Habilitar/Desabilitar botões hexadecimais baseado na base
            const keys = document.querySelectorAll('.dev-key');
            keys.forEach(k => {
                if(base === 'DEC') {
                    if(['A','B','C','D','E','F'].includes(k.innerText)) k.classList.add('disabled');
                    else k.classList.remove('disabled');
                } else if(base === 'BIN') {
                    if(!['0','1'].includes(k.innerText)) k.classList.add('disabled');
                    else k.classList.remove('disabled');
                } else if(base === 'OCT') {
                    if(['8','9','A','B','C','D','E','F'].includes(k.innerText)) k.classList.add('disabled');
                    else k.classList.remove('disabled');
                } else {
                    k.classList.remove('disabled');
                }
            });
        }

        function appendDev(char) {
            currentExpression += char;
            updateDevLiveValue();
        }

        function updateDevLiveValue() {
            try {
                if(currentExpression === '') {
                    updateDevDisplays(0);
                    return;
                }
                let radix = 10;
                if(devBase === 'HEX') radix = 16;
                if(devBase === 'BIN') radix = 2;
                if(devBase === 'OCT') radix = 8;

                devValue = parseInt(currentExpression, radix) || 0;
                updateDevDisplays(devValue);
            } catch(e) {}
            document.getElementById('display').innerText = currentExpression;
        }

        function updateDevDisplays(val) {
            document.getElementById('val-hex').innerText = val.toString(16).toUpperCase();
            document.getElementById('val-dec').innerText = val.toString(10);
            document.getElementById('val-bin').innerText = val.toString(2);
        }

        function bitwiseOp(op) {
            currentExpression += ` ${op} `;
            updateDisplay();
        }

        function calculateDev() {
            try {
                let res = eval(currentExpression);
                devValue = res;
                currentExpression = res.toString(devBase === 'HEX' ? 16 : devBase === 'BIN' ? 2 : 10).toUpperCase();
                updateDevDisplays(devValue);
                updateDisplay();
            } catch(e) {
                currentExpression = 'ERR_DEV';
                updateDisplay();
                setTimeout(clearAll, 1200);
            }
        }

        // Lógica Financeira
        function calculateFinancial() {
            let pv = parseFloat(document.getElementById('fin-pv').value) || 0;
            let i = (parseFloat(document.getElementById('fin-i').value) || 0) / 100;
            let n = parseFloat(document.getElementById('fin-n').value) || 0;

            let fv = pv * Math.pow((1 + i), n);
            let profit = fv - pv;

            historyExpression = `PV: R$${pv} | i:${i*100}% | n:${n}m`;
            currentExpression = `FV: R$${fv.toFixed(2)} (Lucro: R$${profit.toFixed(2)})`;
            updateDisplay();
        }
    </script>
</body>
</html>
