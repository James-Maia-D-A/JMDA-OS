<!-- GIF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
/* Fallbacks para carregamento da biblioteca GIF. */
window.CYBERPAINT_GIF_URLS = [
    "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js",
    "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js",
    "https://unpkg.com/gif.js@0.2.0/dist/gif.js"
];
window.cyberPaintGifPromise = null;
window.ensureGifLibrary = function(){
    if(window.GIF) return Promise.resolve(window.GIF);
    if(window.cyberPaintGifPromise) return window.cyberPaintGifPromise;
    window.cyberPaintGifPromise = new Promise(function(resolve,reject){
        var urls = window.CYBERPAINT_GIF_URLS.slice(1);
        function next(){
            if(window.GIF) return resolve(window.GIF);
            var url = urls.shift();
            if(!url) return reject(new Error("Não foi possível carregar a biblioteca GIF."));
            var script = document.createElement("script");
            script.src = url;
            script.onload = function(){
                if(window.GIF) resolve(window.GIF);
                else next();
            };
            script.onerror = next;
            document.head.appendChild(script);
        }
        next();
    });
    return window.cyberPaintGifPromise;
};
</script>

<!-- JSPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

:root{
    --cyan:#00f2ff;
    --pink:#ff00d4;
    --green:#00ff88;

    --bg:#08090d;
    --panel:#11131b;
    --panel2:#181b25;
    --panel3:#0d0f15;

    --border:#292e3b;

    --text:#edfaff;
    --muted:#7f899b;

    --danger:#ff3155;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    background:

        radial-gradient(
            circle at 70% 20%,
            rgba(0,242,255,.07),
            transparent 30%
        ),

        radial-gradient(
            circle at 20% 80%,
            rgba(255,0,212,.05),
            transparent 30%
        ),

        var(--bg);

    color:var(--text);

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   APP
===================================================== */

.app{

    width:100%;
    height:100%;

    display:flex;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

    width:300px;
    min-width:300px;

    background:
        rgba(17,19,27,.98);

    border-right:
        1px solid var(--border);

    overflow-y:auto;

    display:flex;
    flex-direction:column;

}


.logo{

    padding:18px;

    border-bottom:
        1px solid var(--border);

}


.logo h1{

    margin:0;

    font-size:21px;

    letter-spacing:2px;

}


.logo span{

    color:var(--cyan);

    text-shadow:
        0 0 12px
        rgba(0,242,255,.7);

}


.logo small{

    color:var(--muted);

    font-size:9px;

    letter-spacing:3px;

}


/* =====================================================
   SECTION
===================================================== */

.section{

    padding:13px;

    border-bottom:
        1px solid var(--border);

}


.section-title{

    font-size:10px;

    color:var(--muted);

    letter-spacing:2px;

    margin-bottom:10px;

    text-transform:uppercase;

}


/* =====================================================
   TOOL GRID
===================================================== */

.tools{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:6px;

}


.tool{

    height:50px;

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    border-radius:5px;

    color:#b8c1d2;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    transition:.15s;

}


.tool .icon{

    font-size:17px;

}


.tool span{

    font-size:8px;

}


.tool:hover{

    border-color:
        var(--cyan);

    color:
        var(--cyan);

}


.tool.active{

    background:
        rgba(0,242,255,.1);

    border-color:
        var(--cyan);

    color:
        var(--cyan);

    box-shadow:
        0 0 12px
        rgba(0,242,255,.12);

}


/* =====================================================
   CONTROLS
===================================================== */

.control{

    margin-bottom:11px;

}


.control:last-child{

    margin-bottom:0;

}


.control label{

    display:flex;

    justify-content:
        space-between;

    font-size:10px;

    color:#aab3c3;

    margin-bottom:6px;

}


.value{

    color:var(--cyan);

}


input[type=range]{

    width:100%;

    accent-color:
        var(--cyan);

}


input[type=color]{

    width:100%;

    height:36px;

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    padding:3px;

    cursor:pointer;

}


select{

    width:100%;

    background:
        var(--panel2);

    color:white;

    border:
        1px solid var(--border);

    padding:8px;

    border-radius:4px;

}


/* =====================================================
   COLOR
===================================================== */

.color-row{

    display:grid;

    grid-template-columns:
        1fr 40px;

    gap:6px;

}


.color-box{

    width:40px;
    height:36px;

    border:
        1px solid var(--border);

    border-radius:4px;

    background:#00f2ff;

}


/* =====================================================
   BUTTONS
===================================================== */

.button-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;

}


.action{

    background:
        var(--panel2);

    color:#d9e4f2;

    border:
        1px solid var(--border);

    padding:8px;

    border-radius:4px;

    cursor:pointer;

}


.action:hover{

    border-color:
        var(--cyan);

    color:
        var(--cyan);

}


.danger:hover{

    border-color:
        var(--danger);

    color:
        var(--danger);

}


.export:disabled{
    opacity:.55;
    cursor:wait;
}

.export{

    background:
        linear-gradient(
            90deg,
            #008cff,
            #ff00d4
        );

    color:white!important;

    border:0;

    font-weight:bold;

}


/* =====================================================
   WORKSPACE
===================================================== */

.workspace{

    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

    height:55px;
    min-height:55px;

    background:
        rgba(14,16,23,.98);

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    gap:7px;

    padding:0 12px;

}


.top-button{

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    color:#c8d2e2;

    padding:
        7px 11px;

    border-radius:4px;

    cursor:pointer;

}


.top-button:hover{

    border-color:
        var(--cyan);

    color:
        var(--cyan);

}


.spacer{

    flex:1;

}


.zoom-display{

    min-width:50px;

    text-align:center;

    color:var(--cyan);

    font-size:11px;

}


/* =====================================================
   CANVAS AREA
===================================================== */

.canvas-zone{

    flex:1;

    overflow:auto;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    background-color:#090b10;

    background-image:

        linear-gradient(
            45deg,
            #11141b 25%,
            transparent 25%
        ),

        linear-gradient(
            -45deg,
            #11141b 25%,
            transparent 25%
        ),

        linear-gradient(
            45deg,
            transparent 75%,
            #11141b 75%
        ),

        linear-gradient(
            -45deg,
            transparent 75%,
            #11141b 75%
        );

    background-size:
        24px 24px;

    background-position:
        0 0,
        0 12px,
        12px -12px,
        -12px 0;

}


/* =====================================================
   CANVAS FRAME
===================================================== */

.canvas-frame{

    width:1200px;
    height:800px;

    position:relative;

    background:white;

    box-shadow:
        0 0 0 1px #333,
        0 20px 60px
        rgba(0,0,0,.7);

    transform-origin:center center;

}


.canvas-frame canvas{

    position:absolute;

    left:0;
    top:0;

    width:1200px;
    height:800px;

}


/* =====================================================
   ONION SKIN
===================================================== */

#onionCanvas{

    z-index:1;

    pointer-events:none;

}


#canvas{

    z-index:2;

}


.onion-controls{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;

}


.onion-button{

    background:
        var(--panel2);

    color:#b8c1d2;

    border:
        1px solid var(--border);

    padding:8px;

    border-radius:4px;

    cursor:pointer;

}


.onion-button.active{

    color:var(--cyan);

    border-color:
        var(--cyan);

    background:
        rgba(0,242,255,.08);

}


/* =====================================================
   TIMELINE
===================================================== */

.timeline{

    height:175px;

    min-height:175px;

    background:
        var(--panel3);

    border-top:
        1px solid var(--border);

    display:flex;

    flex-direction:column;

}


.timeline-header{

    height:40px;

    min-height:40px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:0 10px;

    border-bottom:
        1px solid var(--border);

}


.timeline-title{

    color:var(--cyan);

    font-size:11px;

    letter-spacing:1px;

    font-weight:bold;

}


.frame-counter{

    color:var(--muted);

    font-size:10px;

}


.timeline-spacer{

    flex:1;

}


.play-button{

    background:
        rgba(0,255,136,.08);

    border:
        1px solid var(--green);

    color:var(--green);

    padding:6px 12px;

    border-radius:4px;

    cursor:pointer;

}


.play-button.playing{

    background:
        rgba(255,49,85,.1);

    border-color:
        var(--danger);

    color:
        var(--danger);

}


.fps{

    display:flex;

    align-items:center;

    gap:5px;

    color:var(--muted);

    font-size:10px;

}


.fps input{

    width:55px;

    background:
        var(--panel2);

    color:white;

    border:
        1px solid var(--border);

    padding:5px;

}


.loop-label{

    color:#9da7b8;

    font-size:10px;

    display:flex;

    align-items:center;

    gap:4px;

}


/* =====================================================
   FRAME LIST
===================================================== */

.frames{

    flex:1;

    display:flex;

    align-items:center;

    gap:9px;

    padding:
        10px;

    overflow-x:auto;

}


.frame-item{

    width:115px;

    min-width:115px;

    height:110px;

    background:
        #090b10;

    border:
        1px solid var(--border);

    border-radius:5px;

    cursor:pointer;

    position:relative;

    overflow:hidden;

}


.frame-item:hover{

    border-color:
        var(--cyan);

}


.frame-item.active{

    border:
        2px solid var(--cyan);

    box-shadow:
        0 0 12px
        rgba(0,242,255,.2);

}


.frame-item img{

    width:100%;

    height:82px;

    object-fit:contain;

    background:
        white;

}


.frame-number{

    height:27px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:10px;

    color:#b7c0d0;

}


.frame-delete{

    position:absolute;

    right:4px;

    top:4px;

    width:20px;

    height:20px;

    border:0;

    border-radius:3px;

    background:
        rgba(0,0,0,.7);

    color:white;

    cursor:pointer;

}


.frame-delete:hover{

    color:#ff3155;

}


/* =====================================================
   STATUS
===================================================== */

.statusbar{

    height:27px;

    min-height:27px;

    background:
        #0e1016;

    border-top:
        1px solid var(--border);

    color:#687286;

    font-size:9px;

    display:flex;

    align-items:center;

    gap:20px;

    padding:
        0 10px;

}


.statusbar strong{

    color:
        var(--cyan);

}


#imageLoader{

    display:none;

}


/* =====================================================
   ANIMATION PROGRESS
===================================================== */

.animation-progress{

    position:fixed;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    width:330px;

    background:
        rgba(8,9,13,.97);

    border:
        1px solid var(--cyan);

    padding:20px;

    border-radius:6px;

    z-index:999;

    display:none;

    box-shadow:
        0 0 40px
        rgba(0,242,255,.2);

}


.animation-progress h3{

    margin:
        0 0 10px;

    color:
        var(--cyan);

    font-size:14px;

}


.progress-track{

    width:100%;

    height:7px;

    background:#222733;

    border-radius:5px;

    overflow:hidden;

}


.progress-bar{

    width:0%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--pink)
        );

}


.progress-text{

    margin-top:8px;

    color:#8e98aa;

    font-size:10px;

}


@media(max-width:1000px){

    .sidebar{

        width:250px;

        min-width:250px;

    }

    .tools{

        grid-template-columns:
            repeat(3,1fr);

    }

}

</style>

</head>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );


const onionCanvas =
    document.getElementById(
        "onionCanvas"
    );

const onionCtx =
    onionCanvas.getContext(
        "2d"
    );


const canvasFrame =
    document.getElementById(
        "canvasFrame"
    );


/* =====================================================
   CONFIG
===================================================== */

const WIDTH = 1200;
const HEIGHT = 800;


/* =====================================================
   FRAMES
===================================================== */

let frames = [];

let currentFrame = 0;


/*
   Cada frame armazena:

   image = PNG do desenho

   name = nome

   duration = duração

*/

function createFrame(){

    return {

        image:
            createBlankImage(),

        name:
            "Frame",

        duration:
            1000 / 12

    };

}


function createBlankImage(){

    // Fundo transparente para o onion skin (fantasma) aparecer
    // O branco vem do CSS de .canvas-frame
    const temp = document.createElement("canvas");
    temp.width = WIDTH;
    temp.height = HEIGHT;
    const tempCtx = temp.getContext("2d");
    tempCtx.clearRect(0, 0, WIDTH, HEIGHT);
    return temp.toDataURL("image/png");

}


/* =====================================================
   HISTORY
===================================================== */

let history = [];
let historyIndex = -1;
let frameLoading = false;
let loadGeneration = 0;


function saveHistory(){

    if(!frames[currentFrame] || frameLoading){
        return;
    }

    const current = canvas.toDataURL("image/png");
    frames[currentFrame].image = current;

    history = history.slice(0, historyIndex + 1);
    history.push(current);
    historyIndex++;

    if(history.length > 40){
        history.shift();
        historyIndex--;
    }

    updateFrameThumbnail(currentFrame);
}


function undo(){

    if(historyIndex <= 0 || frameLoading){
        return;
    }

    historyIndex--;
    restoreHistory();
}


function redo(){

    if(historyIndex >= history.length - 1 || frameLoading){
        return;
    }

    historyIndex++;
    restoreHistory();
}


function resetCanvasState(){
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}


function restoreHistory(){

    if(frameLoading) return;

    const img = new Image();

    img.onload = function(){
        resetCanvasState();
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.drawImage(img, 0, 0);
        frames[currentFrame].image = canvas.toDataURL("image/png");
        updateOnion();
        updateFrameThumbnail(currentFrame);
    };

    img.src = history[historyIndex];
}


/* =====================================================
   INITIALIZE
===================================================== */

function initialize(){

    frames = [createFrame()];
    currentFrame = 0;
    loadFrame(0, false);
    renderFrames();
}


initialize();


/* =====================================================
   LOAD FRAME
===================================================== */

function loadFrame(index, saveCurrent = true){

    if(index < 0 || index >= frames.length){
        return;
    }

    if(saveCurrent && !frameLoading){
        saveCurrentFrame();
    }

    currentFrame = index;
    frameLoading = true;
    const thisGeneration = ++loadGeneration;

    updateFrameUI();
    highlightActiveFrame();

    const img = new Image();

    img.onload = function(){

        if(thisGeneration !== loadGeneration || currentFrame !== index){
            return;
        }

        // CRÍTICO: resetar alpha/composite antes de desenhar,
        // senão a opacidade residual do pincel "apaga" o frame a cada troca
        resetCanvasState();
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.drawImage(img, 0, 0);

        history = [canvas.toDataURL("image/png")];
        historyIndex = 0;
        frameLoading = false;

        updateOnion();
        updateFrameUI();
        highlightActiveFrame();
    };

    img.onerror = function(){
        if(thisGeneration === loadGeneration){
            frameLoading = false;
        }
        console.error("Erro ao carregar frame", index);
    };

    img.src = frames[index].image;
}


function saveCurrentFrame(){

    if(!frames[currentFrame] || frameLoading){
        return;
    }

    frames[currentFrame].image = canvas.toDataURL("image/png");
    updateFrameThumbnail(currentFrame);
}


function updateFrameThumbnail(index){

    if(index < 0 || index >= frames.length) return;

    const container = document.getElementById("frames");
    if(!container) return;

    const items = container.querySelectorAll(".frame-item");
    if(!items[index]) return;

    const img = items[index].querySelector("img");
    if(img){
        img.src = frames[index].image;
    }
}


function highlightActiveFrame(){

    const container = document.getElementById("frames");
    if(!container) return;

    const items = container.querySelectorAll(".frame-item");
    items.forEach(function(item, i){
        if(i === currentFrame){
            item.classList.add("active");
        } else {
            item.classList.remove("active");
        }
    });
}


/* =====================================================
   ADD FRAME
===================================================== */

function addFrame(){

    saveCurrentFrame();


    const newFrame =
        createFrame();


    frames.splice(
        currentFrame + 1,
        0,
        newFrame
    );


    loadFrame(
        currentFrame + 1,
        false
    );


    renderFrames();

}


/* =====================================================
   DUPLICATE FRAME
===================================================== */

function duplicateFrame(){

    saveCurrentFrame();


    const copy = {

        image:
            frames[currentFrame].image,

        name:
            frames[currentFrame].name,

        duration:
            frames[currentFrame].duration

    };


    frames.splice(
        currentFrame + 1,
        0,
        copy
    );


    loadFrame(
        currentFrame + 1,
        false
    );


    renderFrames();

}


/* =====================================================
   DELETE FRAME
===================================================== */

function deleteFrame(){

    if(
        frames.length <= 1
    ){

        alert(
            "A animação precisa ter pelo menos um frame."
        );

        return;

    }


    if(
        !confirm(
            "Excluir este frame?"
        )
    ){

        return;

    }


    frames.splice(
        currentFrame,
        1
    );


    if(
        currentFrame >=
        frames.length
    ){

        currentFrame =
            frames.length - 1;

    }


    loadFrame(
        currentFrame,
        false
    );


    renderFrames();

}


/* =====================================================
   CLEAR FRAME
===================================================== */

function clearFrame(){

    if(!confirm("Limpar o desenho deste frame?")){
        return;
    }

    if(frameLoading) return;

    resetCanvasState();
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    saveHistory();
    updateOnion();
}


/* =====================================================
   FRAME NAVIGATION
===================================================== */

function previousFrame(){

    if(currentFrame > 0){
        loadFrame(currentFrame - 1, true);
    }

}


function nextFrame(){

    if(currentFrame < frames.length - 1){
        loadFrame(currentFrame + 1, true);
    }

}


/* =====================================================
   TIMELINE
===================================================== */

function renderFrames(){

    const container =
        document.getElementById(
            "frames"
        );


    container.innerHTML =
        "";


    frames.forEach(
        (frame,index)=>{

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "frame-item";


            if(
                index ===
                currentFrame
            ){

                item.classList.add(
                    "active"
                );

            }


            item.onclick =
                function(){

                    loadFrame(
                        index
                    );

                };


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                frame.image;


            item.appendChild(
                img
            );


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "frame-number";


            number.textContent =
                `${index+1} — ${frame.name}`;


            item.appendChild(
                number
            );


            const del =
                document.createElement(
                    "button"
                );


            del.className =
                "frame-delete";


            del.textContent =
                "×";


            del.onclick =
                function(event){

                    event.stopPropagation();

                    if(currentFrame !== index){
                        saveCurrentFrame();
                    }
                    currentFrame = index;
                    deleteFrame();

                };


            item.appendChild(
                del
            );


            container.appendChild(
                item
            );

        }
    );


    updateFrameUI();

}


function updateFrameUI(){

    document
        .getElementById(
            "frameCounter"
        )
        .textContent =
        `Frame ${currentFrame+1} / ${frames.length}`;


    document
        .getElementById(
            "statusFrame"
        )
        .textContent =
        currentFrame+1;

}


/* =====================================================
   ONION SKIN
===================================================== */

let onionEnabled = true;
let nextOnionEnabled = false;
let onionGeneration = 0;


function toggleOnion(){

    onionEnabled = !onionEnabled;

    document
        .getElementById("onionButton")
        .classList.toggle("active", onionEnabled);

    updateOnion();
}


function toggleNextOnion(){

    nextOnionEnabled = !nextOnionEnabled;

    document
        .getElementById("nextOnionButton")
        .classList.toggle("active", nextOnionEnabled);

    updateOnion();
}


function updateOnion(){

    const gen = ++onionGeneration;

    onionCtx.save();
    onionCtx.setTransform(1, 0, 0, 1, 0, 0);
    onionCtx.globalAlpha = 1;
    onionCtx.globalCompositeOperation = "source-over";
    onionCtx.clearRect(0, 0, WIDTH, HEIGHT);
    onionCtx.restore();

    const opacity = parseInt(document.getElementById("onionOpacity").value, 10) / 100;

    document.getElementById("onionValue").textContent = Math.round(opacity * 100) + "%";

    const jobs = [];

    if(onionEnabled && currentFrame > 0){
        jobs.push({ index: currentFrame - 1, opacity: opacity, direction: "previous" });
    }

    if(nextOnionEnabled && currentFrame < frames.length - 1){
        jobs.push({ index: currentFrame + 1, opacity: opacity * 0.7, direction: "next" });
    }

    if(!jobs.length) return;

    // Desenha em sequência para evitar corrida entre os dois fantasmas
    (async function(){
        for(const job of jobs){
            if(gen !== onionGeneration) return;
            await drawOnionFrame(job.index, job.opacity, job.direction, gen);
        }
    })();
}


function drawOnionFrame(index, opacity, direction, gen){

    return new Promise(function(resolve){

        if(index < 0 || index >= frames.length){
            resolve();
            return;
        }

        const img = new Image();

        img.onload = function(){

            if(gen !== onionGeneration){
                resolve();
                return;
            }

            // Canvas temporário: remove quase-branco para o fantasma
            // funcionar mesmo em frames antigos com fundo branco
            const temp = document.createElement("canvas");
            temp.width = WIDTH;
            temp.height = HEIGHT;
            const tctx = temp.getContext("2d");
            tctx.drawImage(img, 0, 0);

            const imageData = tctx.getImageData(0, 0, WIDTH, HEIGHT);
            const data = imageData.data;

            for(let i = 0; i < data.length; i += 4){
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];

                // Trata branco/quase-branco como transparente
                if(a < 8 || (r > 245 && g > 245 && b > 245)){
                    data[i + 3] = 0;
                }
            }

            tctx.putImageData(imageData, 0, 0);

            // Tingimento no canvas temporário (não no onion),
            // para anterior e próximo não se sobrescreverem
            tctx.globalCompositeOperation = "source-atop";
            tctx.fillStyle = direction === "previous"
                ? "rgba(255, 40, 80, 0.5)"
                : "rgba(0, 200, 255, 0.5)";
            tctx.fillRect(0, 0, WIDTH, HEIGHT);
            tctx.globalCompositeOperation = "source-over";

            onionCtx.save();
            onionCtx.globalAlpha = opacity;
            onionCtx.globalCompositeOperation = "source-over";
            onionCtx.drawImage(temp, 0, 0);
            onionCtx.restore();

            resolve();
        };

        img.onerror = function(){
            resolve();
        };

        img.src = frames[index].image;
    });
}


document
    .getElementById("onionOpacity")
    .addEventListener("input", updateOnion);


/* =====================================================
   TOOL
===================================================== */

let currentTool =
    "select";


function setTool(tool){

    currentTool =
        tool;


    document
        .querySelectorAll(
            ".tool"
        )
        .forEach(
            button=>{

                button.classList.remove(
                    "active"
                );


                if(
                    button.dataset.tool ===
                    tool
                ){

                    button.classList.add(
                        "active"
                    );

                }

            }
        );


    const names = {

        select:"Selecionar",

        pencil:"Lápis",

        brush:"Pincel",

        marker:"Marcador",

        spray:"Spray",

        charcoal:"Carvão",

        eraser:"Borracha",

        line:"Linha",

        rect:"Retângulo",

        circle:"Elipse",

        text:"Texto",

        picker:"Conta-gotas",

        fill:"Preencher",

        crop:"Recortar"

    };


    document
        .getElementById(
            "currentTool"
        )
        .textContent =
        names[tool] || tool;


    const brushSelect = document.getElementById("brushType");
    if(brushSelect){
        const map = {
            pencil: "pencil",
            brush: "ink",
            marker: "marker",
            spray: "spray",
            charcoal: "charcoal"
        };
        if(map[tool]){
            brushSelect.value = map[tool];
        }
    }

    canvas.style.cursor =
        tool === "select"
        ? "default"
        : "crosshair";

}


/* =====================================================
   COLORS
===================================================== */

function updateColor(){

    const color =
        document
        .getElementById(
            "colorPicker"
        ).value;


    document
        .getElementById(
            "colorPreview"
        )
        .style.background =
        color;

}


updateColor();


/* =====================================================
   BRUSH SETTINGS
===================================================== */

function updateBrush(){

    const size =
        document
        .getElementById(
            "brushSize"
        ).value;


    const opacity =
        document
        .getElementById(
            "opacity"
        ).value;


    const smooth =
        document
        .getElementById(
            "smooth"
        ).value;


    const pressure =
        document
        .getElementById(
            "pressure"
        ).value;


    document
        .getElementById(
            "sizeValue"
        )
        .textContent =
        `${size} px`;


    document
        .getElementById(
            "opacityValue"
        )
        .textContent =
        `${opacity}%`;


    document
        .getElementById(
            "smoothValue"
        )
        .textContent =
        `${smooth}%`;


    document
        .getElementById(
            "pressureValue"
        )
        .textContent =
        `${pressure}%`;

}


/* =====================================================
   POINTER
===================================================== */

function getPointer(event){

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (event.clientX -
             rect.left)
            *
            WIDTH /
            rect.width,

        y:
            (event.clientY -
             rect.top)
            *
            HEIGHT /
            rect.height

    };

}


/* =====================================================
   DRAWING
===================================================== */

let drawing =
    false;


let lastX =
    0;


let lastY =
    0;


let startX =
    0;


let startY =
    0;


let snapshot =
    null;


canvas.addEventListener(
    "mousedown",
    startDrawing
);


canvas.addEventListener(
    "mousemove",
    draw
);


canvas.addEventListener(
    "mouseup",
    stopDrawing
);


canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


function startDrawing(event){

    if(frameLoading || playing){
        return;
    }

    const p =
        getPointer(event);


    startX =
        p.x;

    startY =
        p.y;


    lastX =
        p.x;

    lastY =
        p.y;


    drawing =
        true;


    snapshot =
        ctx.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        );


    if(
        currentTool ===
        "eraser"
    ){

        erase(
            p.x,
            p.y
        );

        return;

    }


    if(
        currentTool === "pencil" ||
        currentTool === "brush" ||
        currentTool === "marker" ||
        currentTool === "charcoal"
    ){

        drawDot(
            p.x,
            p.y
        );

        return;

    }


    if(
        currentTool ===
        "spray"
    ){

        spray(
            p.x,
            p.y
        );

        return;

    }


    if(
        currentTool ===
        "picker"
    ){

        pickColor(
            p.x,
            p.y
        );

        drawing =
            false;

        return;

    }


    if(
        currentTool ===
        "fill"
    ){

        floodFill(
            Math.floor(p.x),
            Math.floor(p.y)
        );

        drawing =
            false;

        saveHistory();

        return;

    }


    if(
        currentTool ===
        "text"
    ){

        createText(
            p.x,
            p.y
        );

        drawing =
            false;

        return;

    }


}


function draw(event){

    if(!drawing)
        return;


    const p =
        getPointer(event);


    if(
        currentTool ===
        "eraser"
    ){

        erase(
            p.x,
            p.y
        );

        return;

    }


    if(
        currentTool === "pencil" ||
        currentTool === "brush" ||
        currentTool === "marker" ||
        currentTool === "charcoal"
    ){

        drawBrush(
            p.x,
            p.y
        );

        return;

    }


    if(
        currentTool ===
        "spray"
    ){

        spray(
            p.x,
            p.y
        );

        return;

    }


    if(
        currentTool === "line" ||
        currentTool === "rect" ||
        currentTool === "circle"
    ){

        drawShape(
            p.x,
            p.y
        );

    }

}


function stopDrawing(event){

    if(!drawing)
        return;


    const p =
        event &&
        event.clientX !== undefined
        ? getPointer(event)
        : {
            x:lastX,
            y:lastY
        };


    if(
        currentTool === "line" ||
        currentTool === "rect" ||
        currentTool === "circle"
    ){

        drawShape(
            p.x,
            p.y
        );

    }


    drawing =
        false;


    snapshot =
        null;


    resetCanvasState();
    saveHistory();

}


/* =====================================================
   BRUSH
===================================================== */

function configureBrush(){

    const size =
        parseInt(
            document
            .getElementById(
                "brushSize"
            ).value
        );


    const opacity =
        parseInt(
            document
            .getElementById(
                "opacity"
            ).value
        ) / 100;


    const type =
        document
        .getElementById(
            "brushType"
        ).value;


    const color =
        document
        .getElementById(
            "colorPicker"
        ).value;


    ctx.globalCompositeOperation =
        "source-over";


    ctx.globalAlpha =
        opacity;


    ctx.strokeStyle =
        color;


    ctx.fillStyle =
        color;


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    ctx.lineWidth =
        size;


    if(
        currentTool ===
        "pencil"
    ){

        ctx.globalAlpha =
            opacity*.75;

        ctx.lineWidth =
            Math.max(
                1,
                size*.55
            );

    }


    if(
        currentTool ===
        "marker"
    ){

        ctx.globalAlpha =
            opacity*.35;

        ctx.lineWidth =
            size*2.5;

    }


    if(
        currentTool ===
        "charcoal"
    ){

        ctx.globalAlpha =
            opacity*.5;

    }


    if(
        type ===
        "marker"
    ){

        ctx.globalAlpha =
            opacity*.35;

        ctx.lineWidth =
            size*2.5;

    }

}


/* =====================================================
   DOT
===================================================== */

function drawDot(x,y){

    configureBrush();


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        ctx.lineWidth/2,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   BRUSH
===================================================== */

function drawBrush(x,y){

    configureBrush();


    ctx.beginPath();

    ctx.moveTo(
        lastX,
        lastY
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.stroke();


    lastX =
        x;

    lastY =
        y;

}


/* =====================================================
   ERASER
===================================================== */

function erase(x,y){

    const size =
        parseInt(
            document
            .getElementById(
                "brushSize"
            ).value
        );


    ctx.save();


    ctx.globalCompositeOperation =
        "destination-out";


    ctx.globalAlpha =
        1;


    ctx.lineWidth =
        size;


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    ctx.beginPath();


    ctx.moveTo(
        lastX,
        lastY
    );


    ctx.lineTo(
        x,
        y
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        size/2,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.restore();


    lastX =
        x;

    lastY =
        y;

}


/* =====================================================
   SPRAY
===================================================== */

function spray(x,y){

    const size =
        parseInt(
            document
            .getElementById(
                "brushSize"
            ).value
        );


    const opacity =
        parseInt(
            document
            .getElementById(
                "opacity"
            ).value
        ) / 100;


    const color =
        document
        .getElementById(
            "colorPicker"
        ).value;


    ctx.save();


    ctx.globalAlpha =
        opacity;


    ctx.fillStyle =
        color;


    for(
        let i=0;
        i<size*2;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI*2;


        const radius =
            Math.random() *
            size;


        const px =
            x +
            Math.cos(angle) *
            radius;


        const py =
            y +
            Math.sin(angle) *
            radius;


        ctx.beginPath();


        ctx.arc(
            px,
            py,
            Math.random()*2+.5,
            0,
            Math.PI*2
        );


        ctx.fill();

    }


    ctx.restore();

}


/* =====================================================
   SHAPES
===================================================== */

function drawShape(x,y){

    if(!snapshot)
        return;


    ctx.putImageData(
        snapshot,
        0,
        0
    );


    configureBrush();


    if(
        currentTool ===
        "line"
    ){

        ctx.beginPath();

        ctx.moveTo(
            startX,
            startY
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.stroke();

    }


    if(
        currentTool ===
        "rect"
    ){

        ctx.strokeRect(

            Math.min(
                startX,
                x
            ),

            Math.min(
                startY,
                y
            ),

            Math.abs(
                x-startX
            ),

            Math.abs(
                y-startY
            )

        );

    }


    if(
        currentTool ===
        "circle"
    ){

        const cx =
            (startX+x)/2;


        const cy =
            (startY+y)/2;


        const rx =
            Math.abs(
                x-startX
            )/2;


        const ry =
            Math.abs(
                y-startY
            )/2;


        ctx.beginPath();


        ctx.ellipse(
            cx,
            cy,
            rx,
            ry,
            0,
            0,
            Math.PI*2
        );


        ctx.stroke();

    }

}


/* =====================================================
   TEXT
===================================================== */

function createText(x,y){

    const text =
        prompt(
            "Digite o texto:"
        );


    if(!text)
        return;


    const size =
        parseInt(
            document
            .getElementById(
                "brushSize"
            ).value
        );


    const color =
        document
        .getElementById(
            "colorPicker"
        ).value;


    ctx.save();


    ctx.globalAlpha =
        parseInt(
            document
            .getElementById(
                "opacity"
            ).value
        )/100;


    ctx.fillStyle =
        color;


    ctx.font =
        `bold ${Math.max(
            16,
            size*4
        )}px Arial`;


    ctx.textBaseline =
        "top";


    ctx.fillText(
        text,
        x,
        y
    );


    ctx.restore();


    saveHistory();

}


/* =====================================================
   PICKER
===================================================== */

function pickColor(x,y){

    const pixel =
        ctx.getImageData(
            Math.floor(x),
            Math.floor(y),
            1,
            1
        ).data;


    const color =
        "#" +
        [
            pixel[0],
            pixel[1],
            pixel[2]
        ]
        .map(
            value =>
            value
            .toString(16)
            .padStart(2,"0")
        )
        .join("");


    document
        .getElementById(
            "colorPicker"
        ).value =
        color;


    updateColor();

}


/* =====================================================
   FLOOD FILL
===================================================== */

function floodFill(
    startX,
    startY
){

    const imageData =
        ctx.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        );


    const data =
        imageData.data;


    const start =
        (
            startY *
            WIDTH +
            startX
        ) * 4;


    const target = [

        data[start],
        data[start+1],
        data[start+2],
        data[start+3]

    ];


    const color =
        hexToArray(
            document
            .getElementById(
                "colorPicker"
            ).value
        );


    if(
        target[0] === color[0] &&
        target[1] === color[1] &&
        target[2] === color[2]
    ){

        return;

    }


    const stack = [
        [startX,startY]
    ];


    while(stack.length){

        const [
            x,
            y
        ] =
            stack.pop();


        if(
            x < 0 ||
            y < 0 ||
            x >= WIDTH ||
            y >= HEIGHT
        ){

            continue;

        }


        const i =
            (
                y *
                WIDTH +
                x
            ) * 4;


        if(
            data[i] !== target[0] ||
            data[i+1] !== target[1] ||
            data[i+2] !== target[2] ||
            data[i+3] !== target[3]
        ){

            continue;

        }


        data[i] =
            color[0];

        data[i+1] =
            color[1];

        data[i+2] =
            color[2];

        data[i+3] =
            255;


        stack.push(
            [x+1,y]
        );

        stack.push(
            [x-1,y]
        );

        stack.push(
            [x,y+1]
        );

        stack.push(
            [x,y-1]
        );

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


function hexToArray(hex){

    return [

        parseInt(
            hex.substring(1,3),
            16
        ),

        parseInt(
            hex.substring(3,5),
            16
        ),

        parseInt(
            hex.substring(5,7),
            16
        ),

        255

    ];

}


/* =====================================================
   IMPORT IMAGE
===================================================== */

function importImage(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const img =
                new Image();


            img.onload =
                function(){

                    const scale =
                        Math.min(

                            WIDTH /
                            img.width,

                            HEIGHT /
                            img.height,

                            1

                        );


                    const w =
                        img.width *
                        scale;


                    const h =
                        img.height *
                        scale;


                    const x =
                        (WIDTH-w)/2;


                    const y =
                        (HEIGHT-h)/2;


                    resetCanvasState();
                    ctx.drawImage(
                        img,
                        x,
                        y,
                        w,
                        h
                    );


                    saveHistory();

                };


            img.src =
                e.target.result;

        };


    reader.readAsDataURL(file);


    event.target.value =
        "";

}

/* =====================================================

===================================================== */

let zoom =
    1;


function applyZoom(){

    canvasFrame.style.transform =
        `scale(${zoom})`;


    document
        .getElementById(
            "zoomDisplay"
        )
        .textContent =
        Math.round(
            zoom*100
        )+"%";

}


function zoomIn(){

    zoom =
        Math.min(
            3,
            zoom+.1
        );


    applyZoom();

}


function zoomOut(){

    zoom =
        Math.max(
            .25,
            zoom-.1
        );


    applyZoom();

}


function resetZoom(){

    zoom =
        1;


    applyZoom();

}

/* =====================================================
   EXPORT PDF
===================================================== */

async function exportPDF(){

    saveCurrentFrame();

    const { jsPDF } = window.jspdf;

    const orientation = WIDTH >= HEIGHT ? "landscape" : "portrait";

    const pdf = new jsPDF({
        orientation,
        unit: "px",
        format: [WIDTH, HEIGHT]
    });

    // Composita em fundo branco (frames são transparentes)
    const temp = document.createElement("canvas");
    temp.width = WIDTH;
    temp.height = HEIGHT;
    const tctx = temp.getContext("2d");
    tctx.fillStyle = "#ffffff";
    tctx.fillRect(0, 0, WIDTH, HEIGHT);

    await new Promise(function(resolve, reject){
        const img = new Image();
        img.onload = function(){
            tctx.drawImage(img, 0, 0);
            resolve();
        };
        img.onerror = reject;
        img.src = frames[currentFrame].image;
    });

    pdf.addImage(temp.toDataURL("image/png"), "PNG", 0, 0, WIDTH, HEIGHT);
    pdf.save(`cyberpaint-frame-${currentFrame+1}.pdf`);
}


/* =====================================================
   PLAYBACK
===================================================== */

let playing =
    false;


let playbackTimer =
    null;


let playbackIndex =
    0;


function togglePlayback(){

    if(playing){

        stopPlayback();

    }
    else{

        startPlayback();

    }

}


function startPlayback(){

    if(
        frames.length === 0
    ){

        return;

    }


    saveCurrentFrame();


    playing =
        true;


    playbackIndex =
        0;


    document
        .getElementById(
            "playButton"
        )
        .textContent =
        "■ STOP";


    document
        .getElementById(
            "playButton"
        )
        .classList.add(
            "playing"
        );


    playNextFrame();

}


function playNextFrame(){

    if(!playing)
        return;


    if(
        playbackIndex >=
        frames.length
    ){

        if(
            document
            .getElementById(
                "loopAnimation"
            ).checked
        ){

            playbackIndex =
                0;

        }
        else{

            stopPlayback();

            return;

        }

    }


    loadFrame(
        playbackIndex,
        false
    );


    const fps =
        Math.max(
            1,
            Math.min(
                60,
                parseInt(
                    document
                    .getElementById(
                        "fps"
                    ).value
                ) || 12
            )
        );


    playbackIndex++;


    playbackTimer =
        setTimeout(
            playNextFrame,
            1000/fps
        );

}


function stopPlayback(){

    playing =
        false;


    clearTimeout(
        playbackTimer
    );


    playbackTimer =
        null;


    document
        .getElementById(
            "playButton"
        )
        .textContent =
        "▶ PLAY";


    document
        .getElementById(
            "playButton"
        )
        .classList.remove(
            "playing"
        );

}


/* =====================================================
   GIF EXPORT
===================================================== */

let exportingGIF = false;

function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    setTimeout(function(){
        link.remove();
        URL.revokeObjectURL(url);
    }, 1000);
}

async function resolveGifWorkerScript(){
    // Baixa o worker e cria um Blob URL (evita bloqueio cross-origin / file://)
    const workerUrls = [
        "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js",
        "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js",
        "https://unpkg.com/gif.js@0.2.0/dist/gif.worker.js"
    ];

    for(const url of workerUrls){
        try{
            const response = await fetch(url);
            if(!response.ok) continue;
            const code = await response.text();
            const blob = new Blob([code], { type: "application/javascript" });
            return URL.createObjectURL(blob);
        }catch(e){
            // tenta o próximo
        }
    }
    return null;
}


async function exportGIF(){
    if(exportingGIF) return;

    const progress = document.getElementById("gifProgress");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const exportButtons = document.querySelectorAll(".export");

    let workerBlobUrl = null;

    try{
        exportingGIF = true;
        exportButtons.forEach(function(button){ button.disabled = true; });

        if(playing) stopPlayback();
        saveCurrentFrame();

        progress.style.display = "block";
        progressBar.style.width = "0%";
        progressText.textContent = "Carregando biblioteca GIF...";

        const GIFConstructor = await ensureGifLibrary();

        if(typeof GIFConstructor !== "function"){
            throw new Error("A biblioteca GIF foi carregada, mas não disponibilizou o encoder.");
        }

        const fps = Math.max(
            1,
            Math.min(
                60,
                parseInt(document.getElementById("fps").value, 10) || 12
            )
        );

        progressText.textContent = "Preparando encoder...";
        workerBlobUrl = await resolveGifWorkerScript();

        const gifOptions = {
            quality: 10,
            width: WIDTH,
            height: HEIGHT,
            // 0 = loop infinito; -1 = não repete (compatível com gif.js)
            repeat: document.getElementById("loopAnimation").checked ? 0 : -1
        };

        if(workerBlobUrl){
            gifOptions.workers = 2;
            gifOptions.workerScript = workerBlobUrl;
        } else {
            // Fallback: processa na thread principal
            gifOptions.workers = 0;
        }

        const gif = new GIFConstructor(gifOptions);

        progressText.textContent = "Preparando frames...";

        const images = await Promise.all(
            frames.map(function(frame, index){
                return new Promise(function(resolve, reject){
                    const img = new Image();
                    img.onload = function(){
                        resolve({ frame: frame, image: img, index: index });
                    };
                    img.onerror = function(){
                        reject(new Error("Não foi possível carregar o frame " + (index + 1) + "."));
                    };
                    img.src = frame.image;
                });
            })
        );

        const delay = Math.max(20, Math.round(1000 / fps));

        for(let index = 0; index < images.length; index++){
            const item = images[index];
            const temp = document.createElement("canvas");
            temp.width = WIDTH;
            temp.height = HEIGHT;

            const tctx = temp.getContext("2d");
            tctx.fillStyle = "#ffffff";
            tctx.fillRect(0, 0, WIDTH, HEIGHT);
            tctx.drawImage(item.image, 0, 0, WIDTH, HEIGHT);

            gif.addFrame(temp, {
                delay: Math.max(20, Number(item.frame.duration) || delay),
                copy: true
            });

            const percentage = Math.round(((index + 1) / images.length) * 45);
            progressBar.style.width = percentage + "%";
            progressText.textContent = `Preparando frame ${index + 1} de ${images.length}...`;
        }

        await new Promise(function(resolve, reject){
            let settled = false;

            function finishError(error){
                if(settled) return;
                settled = true;
                reject(error instanceof Error ? error : new Error(String(error || "Erro interno ao renderizar o GIF.")));
            }

            gif.on("progress", function(value){
                const percentage = 45 + Math.round(value * 55);
                progressBar.style.width = percentage + "%";
                progressText.textContent = `Renderizando GIF: ${Math.round(value * 100)}%`;
            });

            gif.on("finished", function(blob){
                if(settled) return;
                if(!blob || blob.size === 0){
                    return finishError(new Error("O encoder terminou, mas o arquivo GIF ficou vazio."));
                }

                settled = true;
                progressBar.style.width = "100%";
                progressText.textContent = "GIF pronto!";
                downloadBlob(blob, "cyberpaint-animation.gif");
                resolve();
            });

            gif.on("abort", function(){
                finishError(new Error("A exportação do GIF foi abortada."));
            });

            try{
                gif.render();
            }catch(error){
                finishError(error);
            }

            // Timeout de segurança (2 min)
            setTimeout(function(){
                if(!settled){
                    finishError(new Error("Tempo esgotado ao gerar o GIF. Tente com menos frames ou FPS menor."));
                }
            }, 120000);
        });

        setTimeout(function(){
            progress.style.display = "none";
        }, 800);

    }catch(error){
        console.error("Erro ao exportar GIF:", error);
        progress.style.display = "none";
        alert(
            "Não foi possível exportar o GIF.\n\n" +
            (error && error.message ? error.message : "Erro desconhecido.") +
            "\n\nDicas:\n• Abra o HTML com internet ligada\n• Prefira abrir via servidor local (não file://)\n• Tente com poucos frames primeiro"
        );
    }finally{
        exportingGIF = false;
        exportButtons.forEach(function(button){ button.disabled = false; });
        if(workerBlobUrl){
            try{ URL.revokeObjectURL(workerBlobUrl); }catch(e){}
        }
    }
}

   FPS

document
    .getElementById(
        "fps"
    )

            document
                .getElementById(

                )

/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        const active = document.activeElement;
        const editing = active && (
            active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA" ||
            active.tagName === "SELECT" ||
            active.isContentEditable
        );

        if(editing && !(event.ctrlKey || event.metaKey)) return;

        /*
           Ctrl + Z
        */

        if(
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase()
            === "z"
        ){

            event.preventDefault();

            undo();

        }


        /*
           Ctrl + Y
        */

        if(
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase()
            === "y"
        ){

            event.preventDefault();

            redo();

        }


        /*
           B = pincel
        */

        if(
            event.key.toLowerCase()
            === "b"
        ){

            setTool(
                "brush"
            );

        }


        /*
           E = borracha
        */

        if(
            event.key.toLowerCase()
            === "e"
        ){

            setTool(
                "eraser"
            );

        }


        /*
           P = lápis
        */

        if(
            event.key.toLowerCase()
            === "p"
        ){

            setTool(
                "pencil"
            );

        }


        /*
           seta esquerda
        */

        if(
            event.key ===
            "ArrowLeft"
        ){

            previousFrame();

        }


        /*
           seta direita
        */

        if(
            event.key ===
            "ArrowRight"
        ){

            nextFrame();

        }


        /*
           espaço = play
        */

        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();

            togglePlayback();

        }

    }
);

   TOUCH
===================================================== */

canvas.addEventListener(

    function(event){

        event.preventDefault();


        const touch =
            event.touches[0];

            new MouseEvent(
                "mousedown",

                    clientX:

                    clientY:
                        touch.clientY

                }
            )
        );

    },
    {

    }
);

        event.preventDefault();

                    clientX:
                        touch.clientX,

                    clientY:
                        touch.clientY

                }
            )
        );

    },
    {
        passive:false
    }
);
