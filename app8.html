<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERENCIADOR PRO // MATRIX MODE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
        :root {
            --green: #00ff41;
            --green-dark: #008f11;
            --bg: #000000;
            --panel: rgba(0, 30, 0, 0.65);
            --glow: 0 0 15px #00ff41;
            --glow-strong: 0 0 30px #00ff41;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: scan 12s linear infinite;
        }
        @keyframes scan { to { background-position: 0 1000px; } }
        
        .container { max-width:1400px; margin:20px auto; padding:20px; }
        header {
            background:var(--panel); border:2px solid var(--green); padding:20px 30px;
            box-shadow:var(--glow-strong); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;
            font-family:'Orbitron',sans-serif; text-transform:uppercase; letter-spacing:3px;
        }
        h1 { font-size:2.8em; font-weight:900; text-shadow:var(--glow-strong); }
        button {
            background:transparent; border:2px solid var(--green); color:var(--green);
            padding:12px 20px; font-family:'Orbitron',sans-serif; font-weight:bold;
            text-transform:uppercase; cursor:pointer; transition:.3s;
        }
        button:hover { background:var(--green); color:#000; box-shadow:var(--glow-strong); transform:scale(1.05); }
        .card { background:var(--panel); border:2px solid var(--green); padding:25px; margin-bottom:25px; box-shadow:var(--glow); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 15px; }
        input, select {
            width:100%; padding:14px; background:rgba(0,30,0,.9); border:1px solid var(--green);
            color:var(--green); font-family:'Share Tech Mono',monospace;
        }
        .recurrence-options {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid var(--green);
            background: rgba(0,40,0,0.6);
            display: none;
        }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>GERENCIADOR PRO</h1>
        <div class="header-buttons">
            <button id="exportPDF">EXPORT PDF</button>
            <button id="clearAll" class="danger">LIMPAR TUDO</button>
            <button id="btnAdd">+ NOVA TAREFA</button>
            <button id="btnList">MATRIZ</button>
            <button id="btnStart">INICIAR (0)</button>
        </div>
    </header>

    <div id="addSection" class="section active card">
        <h2 style="text-align:center; font-family:'Orbitron'; margin-bottom:30px;" id="formTitle">NOVA TAREFA</h2>
        <input type="hidden" id="editId">

        <div class="form-group"><label>NOME DA TAREFA</label><input type="text" id="taskName"></div>

        <div class="form-grid">
            <div><label>URGÊNCIA</label><select id="urgency">...</select></div>
            <div><label>DIFICULDADE</label><select id="difficulty">...</select></div>
        </div>

        <div class="form-grid">
            <div><label>DATA (opcional)</label><input type="date" id="taskDate"></div>
            <div><label>HORÁRIO (opcional)</label><input type="time" id="taskTime"></div>
        </div>

        <div class="form-grid">
            <div><label>HORÁRIO COMERCIAL?</label><select id="businessHours">...</select></div>
            <div>
                <label>RECORRÊNCIA</label>
                <select id="recurrent">
                    <option value="none">Não recorrente</option>
                    <option value="daily">Diária</option>
                    <option value="weekly">Semanal</option>
                    <option value="monthly">Mensal</option>
                    <option value="yearly">Anual</option>
                </select>
            </div>
        </div>

        <!-- === CAMPOS DE RECORRÊNCIA === -->
        <div id="recurrenceOptions" class="recurrence-options">
            <div id="weeklyOptions">
                <label>Dias da semana:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="0"> Dom</label>
                    <label><input type="checkbox" value="1"> Seg</label>
                    <label><input type="checkbox" value="2"> Ter</label>
                    <label><input type="checkbox" value="3"> Qua</label>
                    <label><input type="checkbox" value="4"> Qui</label>
                    <label><input type="checkbox" value="5"> Sex</label>
                    <label><input type="checkbox" value="6"> Sáb</label>
                </div>
            </div>

            <div id="monthlyOptions">
                <label>Dias do mês (ex: 1,15,28):</label>
                <input type="text" id="monthlyDays" placeholder="1,15,28">
            </div>

            <div id="yearlyOptions">
                <label>Data anual:</label>
                <input type="date" id="yearlyDate">
            </div>
        </div>

        <button id="saveTask" style="margin-top:20px;">SALVAR TAREFA</button>
        <button id="cancelEdit" style="display:none; margin-left:15px; background:#333;">CANCELAR</button>
    </div>

    <!-- Outras seções (list, execute) podem ser mantidas como estavam -->
</div>

<script>
const tasks = JSON.parse(localStorage.getItem('proTasks_v5')) || [];

const els = {
    taskName: document.getElementById('taskName'),
    urgency: document.getElementById('urgency'),
    difficulty: document.getElementById('difficulty'),
    taskDate: document.getElementById('taskDate'),
    taskTime: document.getElementById('taskTime'),
    businessHours: document.getElementById('businessHours'),
    recurrent: document.getElementById('recurrent'),
    recurrenceOptions: document.getElementById('recurrenceOptions'),
    weeklyOptions: document.getElementById('weeklyOptions'),
    monthlyOptions: document.getElementById('monthlyOptions'),
    yearlyOptions: document.getElementById('yearlyOptions'),
    monthlyDays: document.getElementById('monthlyDays'),
    yearlyDate: document.getElementById('yearlyDate'),
    saveTask: document.getElementById('saveTask'),
    cancelEdit: document.getElementById('cancelEdit')
};

// Mostrar/esconder campos de recorrência
els.recurrent.addEventListener('change', () => {
    const type = els.recurrent.value;
    els.recurrenceOptions.style.display = type === 'none' ? 'none' : 'block';
    
    els.weeklyOptions.style.display = type === 'weekly' ? 'block' : 'none';
    els.monthlyOptions.style.display = type === 'monthly' ? 'block' : 'none';
    els.yearlyOptions.style.display = type === 'yearly' ? 'block' : 'none';
});

els.saveTask.onclick = () => {
    const name = els.taskName.value.trim();
    if (!name) return alert("Nome da tarefa é obrigatório!");

    const recurrentType = els.recurrent.value;

    const task = {
        id: Date.now(),
        name,
        urgency: els.urgency.value,
        difficulty: els.difficulty.value,
        businessHours: els.businessHours.value,
        recurrent: recurrentType,
        date: els.taskDate.value,
        time: els.taskTime.value,
        completed: false
    };

    if (recurrentType === 'weekly') {
        task.recurrentDays = Array.from(els.weeklyOptions.querySelectorAll('input:checked'))
                               .map(el => parseInt(el.value));
    } else if (recurrentType === 'monthly') {
        task.recurrentMonthDays = els.monthlyDays.value
            .split(',')
            .map(n => parseInt(n.trim()))
            .filter(n => !isNaN(n) && n >= 1 && n <= 31);
    } else if (recurrentType === 'yearly') {
        task.recurrentYearly = els.yearlyDate.value;
    }

    tasks.push(task);
    localStorage.setItem('proTasks_v5', JSON.stringify(tasks));
    alert("Tarefa salva com sucesso!");
    resetForm();
};

function resetForm() {
    els.taskName.value = '';
    els.taskDate.value = '';
    els.taskTime.value = '';
    els.recurrent.value = 'none';
    els.recurrenceOptions.style.display = 'none';
    document.querySelectorAll('#recurrenceOptions input').forEach(i => {
        if (i.type === 'checkbox') i.checked = false;
        else i.value = '';
    });
}

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
    console.log("Gerenciador PRO carregado com recorrência avançada.");
});
</script>
</body>
</html>
