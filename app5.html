<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS_NET // CYBERNETIC IMAGE VIEWER</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: #0b0c16;
            --border-color: #1f223f;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #f4ee00;
            --neon-green: #00ff66;
            --text-main: #c0d2ff;
            --text-dim: #505c8a;
            --shadow-cyan: 0 0 10px rgba(0, 243, 255, 0.3);
            --shadow-pink: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
        }

        .cyber-frame {
            background: var(--bg-panel);
            border: 2px solid var(--neon-cyan);
            box-shadow: var(--shadow-cyan), inset 0 0 20px rgba(0, 243, 255, 0.05);
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            clip-path: polygon(
                0 0, 
                calc(100% - 15px) 0, 
                100% 15px, 
                100% 100%, 
                15px 100%, 
                0 calc(100% - 15px)
            );
        }

        .cyber-frame::before {
            content: "IMAGE_SYS.VER // 3.12-X";
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-deep);
            padding: 0 10px;
            font-size: 10px;
            color: var(--neon-cyan);
            letter-spacing: 2px;
        }

        /* Top Bar: Inputs e Menu de Ações */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .source-selectors {
            display: flex;
            gap: 10px;
        }

        .file-label {
            background: #0d0f1f;
            border: 1px solid var(--neon-yellow);
            color: var(--neon-yellow);
            padding: 8px 12px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
            display: inline-block;
        }

        .file-label:hover {
            background: rgba(244, 238, 0, 0.1);
            box-shadow: 0 0 10px rgba(244, 238, 0, 0.3);
        }

        .tools-group {
            display: flex;
            gap: 8px;
        }

        .c-btn {
            background: #0d0f1f;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.1s ease;
            font-weight: bold;
            user-select: none;
        }

        .c-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: var(--shadow-cyan);
        }

        .c-btn.action {
            border-color: rgba(255, 0, 85, 0.4);
            color: var(--neon-pink);
        }
        .c-btn.action:hover {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 85, 0.1);
            box-shadow: var(--shadow-pink);
        }

        /* Main Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 15px;
            flex-grow: 1;
            overflow: hidden;
        }

        @media(max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        /* Sidebar: Galeria / Miniaturas */
        .sidebar {
            background: #020308;
            border: 1px solid var(--border-color);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
        }

        .thumb-item {
            background: #0d0f1f;
            border: 1px solid var(--border-color);
            height: 70px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: all 0.2s;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .thumb-item:hover img, .thumb-item.active img {
            opacity: 1;
        }

        .thumb-item.active {
            border-color: var(--neon-cyan);
            box-shadow: var(--shadow-cyan);
        }

        /* Viewer Stage (Tela Principal da Imagem) */
        .viewer-stage {
            background: #020308;
            border: 1px solid var(--border-color);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .viewer-stage::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0, 243, 255, 0.015) 50%);
            background-size: 100% 3px;
            pointer-events: none;
        }

        .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .image-container:active {
            cursor: grabbing;
        }

        #main-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            user-select: none;
        }

        /* Overlay Infos e Alertas na Tela */
        .info-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 11px;
            color: var(--text-dim);
            pointer-events: none;
            background: rgba(2, 3, 8, 0.8);
            padding: 5px 8px;
            border: 1px solid var(--border-color);
        }

        .info-overlay span {
            color: var(--neon-cyan);
        }

        /* Rodapé */
        .cyber-footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--neon-green);
            box-shadow: 0 0 5px var(--neon-green);
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="cyber-frame">
        <!-- Top Bar: Entradas e Controles -->
        <div class="top-bar">
            <div class="source-selectors">
                <label class="file-label">
                    + SELECIONAR FOTOS
                    <input type="file" id="file-input" accept="image/*" multiple style="display: none;" onchange="loadImages(event)">
                </label>
                <label class="file-label" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">
                    + SELECIONAR PASTA
                    <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;" onchange="loadImages(event)">
                </label>
            </div>

            <div class="tools-group">
                <button class="c-btn" onclick="rotateImage(-90)">↺ -90°</button>
                <button class="c-btn" onclick="rotateImage(90)">↻ +90°</button>
                <button class="c-btn" onclick="zoomIn()">ZOOM +</button>
                <button class="c-btn" onclick="zoomOut()">ZOOM -</button>
                <button class="c-btn action" onclick="resetTransform()">RESET</button>
            </div>
        </div>

        <!-- Espaço de Trabalho (Sidebar + Palco de Exibição) -->
        <div class="workspace">
            <div class="sidebar" id="sidebar">
                <div style="text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 40px;">
                    [ SEM ARQUIVOS ]
                </div>
            </div>

            <div class="viewer-stage">
                <div class="info-overlay">
                    ARQUIVO: <span id="file-name">NENHUM</span> | ZOOM: <span id="zoom-val">100%</span> | ROTAÇÃO: <span id="rot-val">0°</span>
                </div>
                
                <div class="image-container" id="image-container">
                    <img id="main-image" src="" alt="" style="display: none;">
                    <div id="placeholder-text" style="color: var(--text-dim); font-size: 12px; text-align: center;">
                        [ SISTEMA DE IMAGEM OCIOSO ]<br>Importe arquivos locais ou uma pasta para visualizar.
                    </div>
                </div>
            </div>
        </div>

        <!-- Rodapé -->
        <div class="cyber-footer">
            <div><span class="status-dot"></span>VISUALIZADOR: ATIVO</div>
            <div id="image-counter">INDEX: 00 / 00</div>
        </div>
    </div>

    <script>
        let imageList = [];
        let currentIndex = 0;
        
        let currentZoom = 1;
        let currentRotation = 0;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        const mainImage = document.getElementById('main-image');
        const placeholderText = document.getElementById('placeholder-text');
        const sidebar = document.getElementById('sidebar');
        const fileNameEl = document.getElementById('file-name');
        const zoomValEl = document.getElementById('zoom-val');
        const rotValEl = document.getElementById('rot-val');
        const imageCounterEl = document.getElementById('image-counter');
        const imageContainer = document.getElementById('image-container');

        function loadImages(event) {
            const files = Array.from(event.target.files).filter(file => file.type.startsWith('image/'));
            if (files.length === 0) return;

            files.forEach(file => {
                imageList.push({
                    name: file.name,
                    url: URL.createObjectURL(file)
                });
            });

            renderSidebar();
            if (mainImage.style.display === 'none') {
                selectImage(0);
            }
            updateCounter();
        }

        function renderSidebar() {
            if (imageList.length === 0) return;
            sidebar.innerHTML = '';
            imageList.forEach((imgObj, index) => {
                const item = document.createElement('div');
                item.className = `thumb-item ${index === currentIndex ? 'active' : ''}`;
                item.innerHTML = `<img src="${imgObj.url}" alt="${imgObj.name}">`;
                item.onclick = () => selectImage(index);
                sidebar.appendChild(item);
            });
        }

        function selectImage(index) {
            if (imageList.length === 0) return;
            currentIndex = index;
            const imgObj = imageList[currentIndex];

            mainImage.src = imgObj.url;
            mainImage.style.display = 'block';
            placeholderText.style.display = 'none';
            fileNameEl.innerText = imgObj.name;

            resetTransform();
            renderSidebar();
            updateCounter();
        }

        function updateCounter() {
            const total = imageList.length;
            const current = total > 0 ? currentIndex + 1 : 0;
            imageCounterEl.innerText = `INDEX: ${current < 10 ? '0' + current : current} / ${total < 10 ? '0' + total : total}`;
        }

        function resetTransform() {
            currentZoom = 1;
            currentRotation = 0;
            panX = 0;
            panY = 0;
            applyTransform();
        }

        function rotateImage(deg) {
            if (imageList.length === 0) return;
            currentRotation = (currentRotation + deg) % 360;
            applyTransform();
        }

        function zoomIn() {
            if (imageList.length === 0) return;
            currentZoom = Math.min(currentZoom + 0.25, 5);
            applyTransform();
        }

        function zoomOut() {
            if (imageList.length === 0) return;
            currentZoom = Math.max(currentZoom - 0.25, 0.25);
            applyTransform();
        }

        function applyTransform() {
            mainImage.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom}) rotate(${currentRotation}deg)`;
            zoomValEl.innerText = `${Math.round(currentZoom * 100)}%`;
            rotValEl.innerText = `${currentRotation}°`;
        }

        // Navegação por Mouse Drag (Pan)
        imageContainer.onmousedown = (e) => {
            if (imageList.length === 0) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        };

        window.onmousemove = (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            applyTransform();
        };

        window.onmouseup = () => {
            isDragging = false;
        };

        // Zoom com a roda do mouse
        imageContainer.onwheel = (e) => {
            if (imageList.length === 0) return;
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        };

        // Navegação por teclado (Setas Esquerda/Direita para trocar fotos)
        window.onkeydown = (e) => {
            if (imageList.length === 0) return;
            if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % imageList.length;
                selectImage(currentIndex);
            } else if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + imageList.length) % imageList.length;
                selectImage(currentIndex);
            }
        };
    </script>
</body>
</html>
