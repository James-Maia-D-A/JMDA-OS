<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMDA OS - Boot</title>
    <style>
        body {
            margin: 0;
            background-color: #000; /* Fundo preto absoluto */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer; /* Indica que a tela é interativa para o Fullscreen */
        }

        /* Container Principal */
        .glitch-wrapper {
            position: relative;
            width: 300px;
            height: auto;
        }

        /* A Imagem Base */
        .glitch-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- EFEITOS DE GLITCH APENAS NA LOGO --- */
        .glitch-container {
            position: relative;
            width: 100%;
            filter: contrast(1.4) brightness(1.2); 
        }

        .glitch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            mix-blend-mode: screen; 
            opacity: 0; 
        }

        /* Camadas de cores do glitch */
        .glitch-layer.red {
            animation: glitch-red 2.5s infinite linear alternate-reverse;
        }
        .glitch-layer.blue {
            animation: glitch-blue 3s infinite linear alternate-reverse;
        }
        .glitch-layer.green {
            animation: glitch-green 3.5s infinite linear alternate-reverse;
        }

        .glitch-container.active {
            animation: glitch-main-shake 0.5s infinite linear alternate-reverse;
        }

        /* Animações das cores */
        @keyframes glitch-red {
            0%, 100% { opacity: 0; transform: translate(0); }
            21% { opacity: 0.8; transform: translate(-3px, 0); }
            22% { opacity: 0; }
        }
        @keyframes glitch-blue {
            0%, 100% { opacity: 0; transform: translate(0); }
            31% { opacity: 0.8; transform: translate(3px, 0); }
            32% { opacity: 0; }
        }
        @keyframes glitch-green {
            0%, 100% { opacity: 0; transform: translate(0); }
            41% { opacity: 0.8; transform: translate(0, 2px); }
            42% { opacity: 0; }
        }

        @keyframes glitch-main-shake {
            0%, 100% { transform: translate(0); }
            30% { transform: translate(2px, -1px); }
            70% { transform: translate(-2px, 1px); }
        }

        /* --- Texto "Iniciando..." --- */
        .boot-text {
            margin-top: 50px;
            color: #ffffff;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.8;
            text-align: center;
        }

        .sub-hint {
            margin-top: 10px;
            color: #555;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body onload="initBoot()">

    <div class="glitch-wrapper">
        <div class="glitch-container" id="glitchBox">
            <!-- Certifique-se de que a imagem se chama 'logo.png' -->
            <img src="logo.png" alt="Logo JMDA" class="glitch-img">
            
            <img src="logo.png" alt="" class="glitch-layer red">
            <img src="logo.png" alt="" class="glitch-layer blue">
            <img src="logo.png" alt="" class="glitch-layer green">
        </div>
    </div>

    <div class="boot-text">
        Iniciando...
        <div class="sub-hint" id="hintText">[Clique em qualquer lugar se o modo tela cheia não ativar automaticamente]</div>
    </div>

    <script>
        function requestFullScreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log("Modo tela cheia aguardando interação do usuário.");
                });
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE/Edge */
                elem.msRequestFullscreen();
            }
        }

        function initBoot() {
            // Tenta ativar o fullscreen direto ao carregar
            requestFullScreen();

            // Permite ativar o fullscreen e esconde a dica ao primeiro clique caso o navegador bloqueie o auto-fullscreen
            document.body.addEventListener('click', () => {
                requestFullScreen();
                const hint = document.getElementById('hintText');
                if(hint) hint.style.display = 'none';
            }, { once: true });

            // Executa o efeito de Glitch
            const box = document.getElementById('glitchBox');
            setInterval(() => {
                if(Math.random() > 0.7) {
                    box.classList.add('active');
                    setTimeout(() => {
                        box.classList.remove('active');
                    }, 150);
                }
            }, 2000);

            // Redirecionamento direto após 4 segundos para o desktop.html
            setTimeout(() => {
                window.location.href = "desktop.html";
            }, 4000);
        }
    </script>
</body>
</html>
